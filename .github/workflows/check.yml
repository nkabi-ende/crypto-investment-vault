name: Check CIV
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Bundle Worker locally without hosting access
        run: node --input-type=module -e "const {build}=await import('esbuild');const r=await build({entryPoints:['src/index.ts'],bundle:true,write:false,format:'esm',platform:'node',external:['node:crypto']});console.log('Worker bundle bytes:',r.outputFiles[0].contents.length)"
      - name: Render actual Big 7 icons into Open Graph preview
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.9.1
          python scripts/generate_brand_assets.py
          python -c "from PIL import Image; x=Image.open('public/og-invitation-v3.png'); assert x.size==(1200,630); assert x.format=='PNG'"
      - name: Inspect live CoinGecko status (only sanitized status codes)
        run: |
          node --input-type=module <<'NODE'
          for (const route of ['/api/markets','/api/market-pulse']) {
            try {
              const res=await fetch('https://cryptoinvestmentvault.com'+route,{signal:AbortSignal.timeout(15000),headers:{'cache-control':'no-cache'}});
              const data=await res.json().catch(()=>({}));
              console.log(JSON.stringify({
                route,status:res.status,code:typeof data.code==='string'?data.code:null,
                source:typeof data.source==='string'?data.source:null,
                error:typeof data.error==='string'?data.error.slice(0,130):null,
                assets:Array.isArray(data.assets)?data.assets.length:null,
                stale:typeof data.stale==='boolean'?data.stale:null,
                asOf:typeof data.asOf==='string'?data.asOf:null
              }));
            } catch(e) { console.log(JSON.stringify({route,error:'Network unreachable or request timed out'})); }
          }
          NODE
      - name: Install browser for mobile checks
        run: npx playwright install --with-deps chromium
      - name: Check mobile funding and membership navigation
        run: node tests/ui-smoke.mjs
      - name: Save mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ-mobile-review
          path: artifacts/ui
