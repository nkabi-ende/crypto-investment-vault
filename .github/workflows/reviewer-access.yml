name: CIV reviewer access
on:
  workflow_dispatch:
    inputs:
      member_id:
        description: Existing CIV account UUID (from the member profile)
        required: true
        type: string
      action:
        description: Reviewer access change
        required: true
        default: grant
        type: choice
        options: [grant, revoke]
permissions:
  contents: read
concurrency:
  group: civ-reviewer-access
  cancel-in-progress: false
jobs:
  reviewer-access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Update the exact existing account
        run: node scripts/kyc-reviewer.mjs "$CIV_REVIEWER_ACTION" "$CIV_REVIEWER_ACCOUNT_ID"
        env:
          CIV_REVIEWER_ACTION: ${{ inputs.action }}
          CIV_REVIEWER_ACCOUNT_ID: ${{ inputs.member_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
