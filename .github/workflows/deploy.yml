name: Deploy CIV to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: civ-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Open Graph and favicon PNG assets
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate_brand_assets.py
          test -s public/og-image.png
          test -s public/favicon-32.png
      - name: Apply D1 database migrations
        run: npx wrangler d1 migrations apply civ-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public API status
        run: |
          node -e "fetch('https://cryptoinvestmentvault.com/api/status').then(async r=>{const d=await r.json();if(!r.ok||d.fundingEnabled!==false||d.liveTradingEnabled!==false)throw Error('Unexpected production API status');console.log('Production API checks passed')}).catch(e=>{console.error(e);process.exit(1)})"
