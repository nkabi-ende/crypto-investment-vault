<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow,noarchive">
 <meta name="theme-color" content="#0b1011">
 <title>Reset your password | CIV</title>
 <link rel="icon" href="/favicon.svg">
 <link rel="stylesheet" href="/reset-password.css">
 <script defer src="/reset-password.js"></script>
</head>
<body>
 <main>
  <img src="/civ-mark.svg" width="116" height="50" alt="Crypto Investment Vault">
  <h1 id="resetTitle">Reset your password</h1>
  <p id="resetHelp">Enter the email address you use to sign in to CIV.</p>
  <form id="requestReset" method="post">
   <label for="resetEmail">Email address</label>
   <input id="resetEmail" type="email" autocomplete="email" maxlength="254" required>
   <button type="submit" disabled>Send reset link</button>
  </form>
  <form id="completeReset" method="post" hidden>
   <label for="newPassword">New password</label>
   <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
   <label for="confirmPassword">Confirm new password</label>
   <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
   <button type="submit" disabled>Update password</button>
  </form>
  <p id="resetMessage" role="status"></p>
  <noscript><p>Enable JavaScript to use password reset.</p></noscript>
  <div class="links">
   <a href="/join?mode=login">Back to sign in</a>
   <a id="newResetLink" href="/reset-password" hidden>Request a new link</a>
  </div>
 </main>
</body>
</html>
