<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b1011"><title>Identity review | CIV</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/member-experience.css"><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b1011;color:#edf5ed}*{box-sizing:border-box}body{margin:0}a{color:#b5f269;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}header,main{max-width:1050px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2b3d2e}header img{width:104px}.kicker{font:11px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:#b5f269}h1{font-size:clamp(35px,6vw,58px);font-weight:550;letter-spacing:-.06em;line-height:1.05}p{font-size:13px;line-height:1.8;color:#a1afa8}.review-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:36px;margin-top:30px}.review-row{display:block;width:100%;text-align:left;color:#e8f1e7;background:none;border:0;border-top:1px solid #354c37;padding:20px 0}.review-row strong,.review-row small{display:block}.review-row strong{font-size:15px;font-weight:550}.review-row small{font-size:10px;line-height:1.8;color:#8fa495;margin-top:6px}.review-row[aria-pressed=true]{color:#b5f269}.review-detail{border-top:1px solid #5a7748;padding-top:24px;min-width:0}.review-detail h2{letter-spacing:-.04em;font-size:25px;font-weight:550;margin:0 0 18px}.review-actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.review-doc{min-height:46px;padding:12px 16px;background:#142119;color:#b5f269;border:1px solid #3b553b;border-radius:9px;font-size:12px}.review-check{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.8;color:#b1c4b4;margin:16px 0}.review-check input{accent-color:#b5f269;margin-top:4px}.review-detail textarea{width:100%;padding:14px;background:#0a130e;border:1px solid #3b523e;border-radius:10px;color:#edf5ed;font-size:13px;line-height:1.7;min-height:110px}.primary{background:#b5f269;color:#101b10;border:0;border-radius:10px;padding:14px 20px;min-height:46px;font-size:13px;font-weight:600}.review-secondary{background:none;color:#e7c18b;border:1px solid #64513c;border-radius:10px;padding:14px 20px;font-size:13px}.review-feedback{color:#e7c18b;min-height:24px}button:disabled{opacity:.5;cursor:wait}button:focus-visible,textarea:focus-visible{outline:2px solid #b5f269;outline-offset:4px}@media(max-width:650px){.review-layout{grid-template-columns:minmax(0,1fr);gap:25px}header,main{padding:22px}}</style><script src="/session-guard.js"></script><script src="/review-identity.js" defer></script></head><body><header><a href="/admin" aria-label="CIV operations home"><img src="/civ-mark.svg" alt="CIV"></a><a href="/dashboard">My account</a></header><main><div class="kicker">OPERATIONS / AUTHORISED REVIEWERS</div><h1>Identity review.</h1><p>Inspect both documents, record your checks and issue an account-linked decision. Uploading a document alone never approves an identity.</p><div id="reviewStatus" role="status"><p>Checking reviewer access…</p></div><div class="review-layout"><div id="reviewQueue" aria-label="Pending identity submissions"></div><section class="review-detail" id="reviewDetail" aria-label="Selected review"><p>Select a pending submission.</p></section></div></main></body></html>
