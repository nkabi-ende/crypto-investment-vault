name = "crypto-investment-vault"
main = "src/index.ts"
compatibility_date = "2026-10-01"

compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/join", "/dashboard", "/r/*"]

[[d1_databases]]
binding = "DB"
database_name = "civ-db"
database_id = "f0a267d4-f8dc-4106-a3d8-3e7f7453dce9"
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "https://cryptoinvestmentvault.com"
FUNDING_ENABLED = "false"
PAYMENTS_ENABLED = "false"
PAYMENT_MODE = "testnet"
CELO_MAINNET_RPC_URL = "https://forno.celo.org"
EMAIL_DELIVERY_ENABLED = "false"
CELO_SEPOLIA_RPC_URL = "https://forno.celo-sepolia.celo-testnet.org"
CELO_TEST_USDC_ADDRESS = "0x2F25deB3848C207fc8E0c34035B3Ba7fC157602B"

[triggers]
crons = ["*/5 * * * *"]

# A CIV-specific namespace; limits are per Cloudflare location.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1424211760"
simple = { limit = 20, period = 60 }
